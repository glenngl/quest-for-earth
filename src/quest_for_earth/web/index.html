<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quest for Earth — Level 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{margin:0;background:#000;color:#fff;font-family:sans-serif}
    #glcanvas{display:block;width:100vw;height:100vh}
    #minimap{
      position:absolute;bottom:10px;left:10px;
      width:150px;height:180px;
      background:rgba(0,0,0,0.6);padding:5px;
      font-size:12px;color:#0f0
    }
    /* The chat log and its input live in the free slot between the
       own-ship gauges and the tactical map, so they never collide with a
       panel in either view. */
    #chat{
      position:absolute;bottom:44px;left:320px;
      width:300px;height:150px;
      background:rgba(0,0,0,0.6);padding:5px;overflow:auto;font-size:12px
    }
    #chat-input{position:absolute;bottom:12px;left:320px;width:300px;padding:5px;
      border:none;border-radius:3px;background:#222;color:#fff}
    /* The join panel is pre-flight furniture: in the cockpit it would sit
       under the squad panel, so it steps aside. */
    body.in-flight #name-input{display:none}
    #name-input{position:absolute;top:10px;right:10px;padding:8px 12px;
      background:#222;color:#fff;border:none;border-radius:4px}
    #fullscreen-btn{position:absolute;top:54px;right:10px;padding:7px 12px;
      background:#17353b;color:#bff2f7;border:1px solid #5ec6d2;
      border-radius:4px;cursor:pointer;font-size:13px}
    #fullscreen-btn:hover{background:#21525c}
    .msg{margin:2px 0}

    /* First-person cockpit HUD. Fixed zones so the eye always knows where
       to look: squad top, own ship left, tactical map right. */
    /* First-person cockpit HUD. Fixed zones so the eye always knows where
       to look: squad top, own ship left, tactical map right. Sized for a
       1080p fullscreen view with generous type and contrast. */
    #cockpit-hud{display:none;position:absolute;inset:0;pointer-events:none;
      font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
    #cockpit-hud.active{display:block}
    /* Trim keeps what the pilot must not lose: the objective and the own
       ship gauges. Only the roster rows and the tactical map go away. */
    #cockpit-hud.min #hud-squad-rows,
    #cockpit-hud.min #hud-tactical,
    #cockpit-hud.min .hud-title{display:none}
    #hud-damage{position:absolute;inset:0;pointer-events:none;opacity:0;
      transition:opacity .18s ease;
      background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(255,30,30,0.38) 100%)}
    #cockpit-hud.hurt #hud-damage{opacity:1}
    /* Hit marker: a brief cross at the gunsight when a shot lands (white)
       or the local pilot takes a hit (red). Combat feedback lives here
       instead of flooding the chat transcript. */
    #hit-marker{position:absolute;left:50%;top:50%;width:26px;height:26px;
      margin:-13px 0 0 -13px;opacity:0;pointer-events:none;
      transition:opacity .12s ease}
    #hit-marker::before,#hit-marker::after{content:"";position:absolute;
      background:rgba(255,255,255,0.95);box-shadow:0 0 6px rgba(120,255,200,0.8)}
    #hit-marker::before{left:11px;top:0;width:3px;height:26px}
    #hit-marker::after{left:0;top:11px;width:26px;height:3px}
    #hit-marker.show{opacity:1}
    #hit-marker.hurt::before,#hit-marker.hurt::after{
      background:rgba(255,90,90,0.95);box-shadow:0 0 6px rgba(255,60,60,0.9)}
    #hit-marker.dead::before,#hit-marker.dead::after{
      background:rgba(255,40,40,1);box-shadow:0 0 10px rgba(255,40,40,1);transform:rotate(45deg)}
    /* Waypoint: points at whatever the objective is, so the pilot can find
       the wormhole in a 64x64x64 cube without hunting for the map. */
    #waypoint{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;
      display:none;pointer-events:none;z-index:5}
    #waypoint.show{display:block}
    #waypoint .chev{position:absolute;inset:0}
    #waypoint .chev::before{content:"";position:absolute;left:8px;top:2px;
      width:10px;height:10px;border-left:2px solid #ffd24d;border-top:2px solid #ffd24d;
      transform:rotate(45deg);box-shadow:0 0 6px rgba(255,210,77,0.7)}
    #waypoint .range{position:absolute;left:0;top:26px;width:52px;margin-left:-13px;
      text-align:center;color:#ffd24d;font-size:11px;text-shadow:0 0 4px #000;
      font-family:ui-monospace,Menlo,Consolas,monospace}
    /* Damage direction: a red chevron at the edge, pointing at the shooter. */
    #damage-arrow{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;
      display:none;pointer-events:none;z-index:6}
    #damage-arrow.show{display:block}
    #damage-arrow .chev{position:absolute;inset:0}
    #damage-arrow .chev::before{content:"";position:absolute;left:8px;top:2px;
      width:10px;height:10px;border-left:2px solid #ff6a5a;border-top:2px solid #ff6a5a;
      transform:rotate(45deg);box-shadow:0 0 8px rgba(255,60,50,0.9)}
    /* Downed overlay: the pilot is destroyed and waiting for the server to
       respawn them. */
    #death-overlay{position:absolute;inset:0;display:none;align-items:center;
      justify-content:center;pointer-events:none;
      background:radial-gradient(ellipse at center, rgba(60,0,0,0.25) 0%, rgba(0,0,0,0.82) 85%)}
    #death-overlay.show{display:flex}
    #death-overlay .death-title{font-size:44px;letter-spacing:12px;color:#ff6a5a;
      text-shadow:0 0 18px rgba(255,60,40,0.8);font-weight:700}
    #death-overlay .death-sub{margin-top:14px;font-size:15px;color:#cfe9ec;
      letter-spacing:3px}
    #death-overlay .death-sub b{color:#ffd24d}
    .hud-panel{position:absolute;background:rgba(3,12,17,0.88);
      border:1px solid rgba(110,220,230,0.6);border-radius:4px;
      padding:12px 14px;color:#d8f6f9;box-shadow:0 0 18px rgba(0,0,0,0.7)}
    .hud-title{color:#7ee6ef;letter-spacing:2px;font-size:12px;
      margin-bottom:9px;border-bottom:1px solid rgba(110,220,230,0.35);
      padding-bottom:5px}
    #hud-squad{top:14px;left:50%;transform:translateX(-50%);
      min-width:520px;text-align:center}
    /* Objective: the first row of the squad panel, so it can never drift
       over another zone. */
    #hud-objective{color:#ffd24d;font-size:13px;letter-spacing:2px;
      text-transform:uppercase;padding-bottom:8px;margin-bottom:8px;
      border-bottom:1px solid rgba(255,210,77,0.35)}
    #hud-objective.done{color:#7dff9b;border-bottom-color:rgba(125,255,155,0.4)}
    .squad-row{display:flex;justify-content:space-between;gap:22px;
      padding:4px 0;color:#eaffff;font-size:15px}
    #hud-vitals{bottom:20px;left:20px;width:260px}
    .vrow{display:flex;align-items:center;gap:8px;margin:8px 0}
    .vrow span{width:72px;color:#a8dde4;font-size:12px;letter-spacing:1px}
    .vrow b{width:52px;text-align:right;color:#fff;font-weight:700;font-size:16px}
    .vbar{flex:1;height:10px;background:rgba(255,255,255,0.14);border-radius:2px;overflow:hidden}
    .vbar i{display:block;height:100%;width:0;background:#6fd2dc;transition:width 0.15s}
    /* Rank row: the ladder the pilot is climbing. */
    .vrow.rank{margin-top:12px;padding-top:9px;border-top:1px solid rgba(110,220,230,0.3)}
    .vrow.rank span{color:#ffe36d}
    .vrow.rank b{color:#ffe36d}
    .vrow.rank .vbar i{background:linear-gradient(90deg,#ffd24d,#ffe36d)}
    .vrow.hold{margin-top:6px}
    .vrow.hold b{color:#7dff9b}
    .vrow.hold .hint{flex:1;text-align:right;color:#7c9aa2;font-size:11px;
      letter-spacing:0;text-transform:none}
    #hud-tactical{bottom:20px;right:20px;width:272px}
    #tactical-map{display:block;width:244px;height:244px;background:#04171c}
  </style>
</head>
<body>
  <div id="name-input">
    <input type="text" id="name-field" value="Player1" style="width:150px">
    <button id="start-btn">Start Game</button>
  </div>
  <button id="fullscreen-btn" title="Fullscreen (F2)">⛶ Fullscreen — F2</button>
  <canvas id="glcanvas"></canvas>
  <div id="minimap"><strong>Mini-Map</strong><canvas width="150" height="150"></canvas></div>
  <div id="chat"><strong>Chat</strong>: <span id="chat-log"></span></div>
  <input id="chat-input" placeholder="type a message...">

  <!-- First-person cockpit HUD: fixed, memorable zones. -->
  <div id="waypoint">
    <div class="chev"></div>
    <div class="range" id="waypoint-range">0u</div>
  </div>
  <div id="damage-arrow"><div class="chev"></div></div>

  <div id="cockpit-hud">
    <div id="hud-damage"></div>
    <div id="hit-marker"></div>    <div id="hud-squad" class="hud-panel">
      <div id="hud-objective">Scanning for contacts</div>
      <div class="hud-title">SQUAD</div>
      <div id="hud-squad-rows"></div>
    </div>
    <div id="hud-vitals" class="hud-panel">
      <div class="hud-title">OWN SHIP</div>
      <div class="vrow"><span>HULL</span><b id="v-hp">100</b><i class="vbar"><i id="b-hp"></i></i></div>
      <div class="vrow"><span>SHIELD</span><b id="v-sh">100</b><i class="vbar"><i id="b-sh"></i></i></div>
      <div class="vrow"><span>ENERGY</span><b id="v-en">100</b><i class="vbar"><i id="b-en"></i></i></div>
      <div class="vrow"><span>METHANE</span><b id="v-ch4">0</b><i class="vbar"><i id="b-ch4"></i></i></div>
      <div class="vrow"><span>METAL</span><b id="v-met">0</b><i class="vbar"><i id="b-met"></i></i></div>
      <div class="vrow rank"><span>RANK</span><b id="v-level">1</b><i class="vbar"><i id="b-xp"></i></i></div>
      <div class="vrow hold"><span>CELLS</span><b id="v-cells">0</b><span class="hint">R — use energy cell</span></div>
      <div class="vrow hold"><span>SPEED</span><b id="v-speed">0</b><span class="hint">u/s</span></div>
    </div>
    <div id="hud-tactical" class="hud-panel">
      <div class="hud-title">TACTICAL</div>
      <canvas id="tactical-map" width="244" height="244"></canvas>
    </div>
  </div>

  <div id="death-overlay">
    <div>
      <div class="death-title">DESTROYED</div>
      <div class="death-sub">RESPAWNING IN <b id="death-count">5</b>S</div>
    </div>
  </div>

  <script src="/static/game.js"></script>
</body>
</html>
