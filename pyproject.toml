[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-for-earth"
version = "0.2.0"
description = "Quest for Earth — a browser multiplayer space-scavenger RPG: the bugs took the solar system; live off what you kill, steal or scavenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "bcrypt>=4.1",
]

[project.scripts]
quest-for-earth = "quest_for_earth.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quest_for_earth = ["data/*.json", "web/*.html", "web/*.css", "web/*.js", "web/vendor/*.js"]
