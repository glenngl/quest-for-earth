name: Quest for Earth CI

# Fast PR/push verification. Image publishing and the Trivy gate live in
# docker-publish.yml, which is the only workflow allowed to push an image.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'data/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - run: python scripts/smoke.py

  playtest:
    name: Gameplay playtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - run: python scripts/playtest.py
